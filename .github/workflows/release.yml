# A `v*` tag cuts a GitHub Release with something installable for every desktop
# platform the repo can actually sign for.
#
# Tags normally come from version.yml, which tags every green push to main and
# calls this workflow directly (a tag pushed with GITHUB_TOKEN triggers nothing).
# A hand-pushed `v*` tag still works. Either way the version comes from the tag,
# not pubspec.yaml, and is injected with --build-name.
#
# The macOS artefact is the interesting one: it is built by tool/release_macos.sh,
# the same script used by hand, so there is one definition of "a release build"
# rather than one in bash and a second in YAML.
name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: Semantic version without the leading v
        required: true
        type: string


permissions:
  contents: write

env:
  TZ: Europe/Berlin
  FLUTTER_VERSION: 3.47.6

jobs:
  guard:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a semantic version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.guard.outputs.version }}
      - name: Desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.guard.outputs.version }} --build-number=${{ github.run_number }}
      - name: Stage
        env:
          V: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/time-log-$V-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/

  windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.guard.outputs.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.guard.outputs.version }} --build-number=${{ github.run_number }}
      - name: Stage
        shell: pwsh
        env:
          V: ${{ needs.guard.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/time-log-$env:V-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/

  macos:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.guard.outputs.version }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Import the Developer ID certificate
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./tool/ci/import_signing_certificate.sh

      - name: Store notarytool credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./tool/ci/store_notary_credentials.sh

      # Signs, verifies, notarises, staples and packages. Unlike every other job
      # here this one is not "build and zip" — the script is the release.
      - name: Build, sign, notarise and package
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./tool/release_macos.sh

      - name: Stage
        run: |
          mkdir -p dist
          cp build/release/*.dmg dist/

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/

      # A rejection is only useful with the log the script saved beside it.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-notary-logs
          path: build/release/notary-*.json
          if-no-files-found: ignore

  # A macOS failure (an expired Apple agreement, a notarisation rejection) must
  # not hold back the platforms that built fine, so this runs whenever at least
  # one artefact exists. A release without a .dmg says so in its notes.
  publish:
    needs: [guard, linux, windows, macos]
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success'
      && (needs.linux.result == 'success' || needs.windows.result == 'success'
      || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # Named, so the macos-notary-logs artefact of a failed run stays out of the release.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{linux,windows,macos}'
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          tag_name: v${{ needs.guard.outputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            ### Artefacts

            | Platform | File | Notes |
            | --- | --- | --- |
            | macOS | `.dmg` | Developer ID, notarised and stapled — opens with no Gatekeeper warning. Missing if the macOS build failed |
            | Windows | `.zip` | Unsigned; SmartScreen will warn |
            | Linux | `.tar.gz` | Portable bundle |

