name: time_log
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5
  sqlite3: ^3.7.0
  flutter_launcher_icons: ^0.14.4

# Every platform's launcher icon is generated from one mark, so they cannot
# drift apart: `dart run flutter_launcher_icons` after editing tool/brand/.
flutter_launcher_icons:
  image_path: "tool/brand/mark-1024.png"
  android: true
  adaptive_icon_background: "#17171A"
  adaptive_icon_foreground: "tool/brand/mark-foreground-1024.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "tool/brand/mark-1024.png"
  web:
    generate: true
    image_path: "tool/brand/mark-1024.png"
    background_color: "#17171A"
    theme_color: "#17171A"
  windows:
    generate: true
    image_path: "tool/brand/mark-1024.png"
    icon_size: 256

flutter:
  uses-material-design: true

  # Geist (SIL Open Font Licence 1.1; see assets/fonts/OFL.txt). Vendored rather
  # than fetched at runtime: this app works offline and must look the same
  # everywhere, and a font that arrives over the network does neither.
  #
  # Two families on purpose (SPEC §9.8): words are set in the sans, every number
  # in the mono.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
